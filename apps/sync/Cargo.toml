[package]
name = "solstice-sync-server"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Solstice Sync's server: vaults as plain files plus Yjs state, synced over WebSocket."
publish = false

[[bin]]
name = "solstice-sync"
path = "src/main.rs"

[dependencies]
solstice-core = { path = "../../crates/solstice-core" }
solstice-sync = { path = "../../crates/solstice-sync" }
solstice-sync-fs = { path = "../../crates/solstice-sync-fs" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
