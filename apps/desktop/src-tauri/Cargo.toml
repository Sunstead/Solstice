[package]
name = "solstice"
version = "0.1.0"
description = "Solstice, a local-first markdown notes app"
authors = ["Sunstead"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "solstice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dependencies]
# `protocol-asset` compiles in the `asset:` scheme the webview uses to load
# workspace images and PDFs. Its scope is granted per workspace in workspace.rs.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
anyhow = "1"
notify-debouncer-full = "0.7.0"
trash = "5"
# Enumerates installed font families for the typography settings' font picker.
font-kit = "0.14"
# `solstice://` links (Atlas opens notes with them). Single instance forwards
# a link that launches a second process to the running one.
tauri-plugin-deep-link = "2"

# Solstice Sync: the client, and signing in to the server (ported from Cosmos).
solstice-sync-client = { path = "../../../crates/solstice-sync-client" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
futures-util = "0.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
tempfile = "3"
