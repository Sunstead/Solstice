<!doctype html>
<html lang="en" class="dark" data-theme="sunstead-dark" data-style="rounded">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- A home-screen app draws under the status bar; the shell pads for it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Solstice</title>
    <script>
      /*
       * Paints the last-used theme before the first frame. The settings store
       * loads asynchronously, so without this the app draws once in the
       * default theme and then flashes to the real one. Pure optimisation --
       * `lib/theme/apply.ts` writes this key and wins a tick later either way,
       * so a stale or missing value costs nothing but the flash it prevents.
       *
       * Keep the ids, schemes and styles in step with @sunstead/ui's
       * lib/themes.ts (themes-sync.test.ts checks).
       */
      (function () {
        var themes = {
          'sunstead-dark': 'dark rounded',
          nebula: 'dark rounded',
          aurora: 'dark rounded',
          mars: 'dark rounded',
          'event-horizon': 'dark rounded',
          eclipse: 'dark rounded',
          'deep-field': 'dark rounded',
          stone: 'dark rounded',
          ember: 'dark rounded',
          concrete: 'dark rounded',
          inferno: 'dark rounded',
          hologram: 'dark tech',
          terminal: 'dark tech',
          'red-alert': 'dark tech',
          'sunstead-light': 'light rounded',
          solar: 'light rounded',
          lunar: 'light rounded',
          comet: 'light rounded',
          orchard: 'light rounded',
          brutalist: 'light rounded',
          bubblegum: 'light rounded',
          blueprint: 'light tech',
        };
        try {
          var saved = JSON.parse(localStorage.getItem('solstice.theme.lastApplied'));
          if (!saved || !Object.prototype.hasOwnProperty.call(themes, saved.theme)) return;
          var info = themes[saved.theme].split(' ');
          var appearance = saved.appearance === 'light' || saved.appearance === 'dark' ? saved.appearance : info[0];
          var root = document.documentElement;
          root.setAttribute('data-theme', saved.theme);
          root.setAttribute('data-style', info[1]);
          root.className = appearance;
          for (var i = 0; i < saved.vars.length; i++) {
            var entry = saved.vars[i];
            if (entry[0].indexOf('--') === 0) root.style.setProperty(entry[0], entry[1]);
          }
        } catch (error) {
          /* No stored theme, or storage is unavailable. */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
