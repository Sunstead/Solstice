[package]
name = "solstice-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Full-text search of a workspace folder: notes, canvases, PDFs and handwriting. Used by the app and by Solstice Sync for the web app."
publish = false

[features]
# The result types as TypeScript, for the app's bindings.
specta = ["dep:specta"]

[dependencies]
solstice-core = { path = "../solstice-core" }
solstice-pdf = { path = "../solstice-pdf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[dev-dependencies]
lopdf = { version = "0.45", default-features = false }
tempfile = "3"
