<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="16"
   height="16"
   viewBox="0 0 16 16"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Two cards joined by an elbow connector: the smallest shape that reads as
       a board of linked nodes rather than a generic document. -->
  <path
     d="M 6,3.5 H 7 A 1,1 0 0 1 8,4.5 V 11.5 A 1,1 0 0 0 9,12.5 H 10"
     style="fill:none;stroke:#9a4dff;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round" />
  <rect
     x="0" y="1" width="6" height="5" rx="1.25"
     style="fill:#9a4dff;fill-opacity:1;stroke:none" />
  <rect
     x="10" y="10" width="6" height="5" rx="1.25"
     style="fill:#9a4dff;fill-opacity:1;stroke:none" />
</svg>
