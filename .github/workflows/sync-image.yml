name: Sync image

# Builds the Solstice Sync server (and the web app inside it) and publishes it
# to GHCR. Mirrors Atlas's image.yml. Versioned apart from the desktop app, by
# the same conventional-commit rules (scripts/release/, docs/release-automation.md).
#
#   every merge that touches the image  ->  :latest, :main, :sha-<short>
#   ... and releases (feat, fix, perf or a breaking change touching it)
#                                       ->  also :<version>, the git tag
#                                           sync-v<version>, and a
#                                           chore(release) commit to main
# Pull requests build and smoke-test without pushing. Deploying is still a
# bump of compose/solstice.yml in Jupiter.
#
# The paths are what the image is made of: scripts/release/products.mjs lists
# the same files for the planner.

on:
  push:
    branches: [main]
    paths:
      - apps/sync/**
      - crates/solstice-core/**
      - crates/solstice-sync/**
      - crates/solstice-sync-fs/**
      - crates/solstice-search/**
      - apps/desktop/**
      - '!apps/desktop/src-tauri/**'
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/sync-image.yml
  pull_request:
    paths:
      - apps/sync/**
      - crates/solstice-core/**
      - crates/solstice-sync/**
      - crates/solstice-sync-fs/**
      - crates/solstice-search/**
      - apps/desktop/**
      - '!apps/desktop/src-tauri/**'
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/sync-image.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (default: from the commits since the last sync-v tag)"
        required: false
        type: string

# On main, runs queue instead of cancelling, so each sees the tag the one before
# it made.
concurrency:
  group: sync-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # What version this is, if it releases: scripts/release/plan.mjs, product sync.
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
      protocol: ${{ steps.plan.outputs.protocol }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan the release
        id: plan
        run: node scripts/release/plan.mjs
        env:
          PRODUCT: sync
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}

  image:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server reports its version at /v1/info. Set on this checkout only;
      # the release job commits it once the image is out.
      - name: Set the version
        if: needs.plan.outputs.publish == 'true'
        run: node scripts/release/set-version.mjs --product sync "${{ needs.plan.outputs.version }}"

      # GHCR image names must be lowercase; the owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/solstice-sync" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=${{ needs.plan.outputs.version }},enable=${{ needs.plan.outputs.publish == 'true' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=solstice-sync
            org.opencontainers.image.description=Solstice Sync: notes synced between devices as plain files
            com.sunstead.solstice.sync-protocol=${{ needs.plan.outputs.protocol }}
            ${{ needs.plan.outputs.publish == 'true' && format('org.opencontainers.image.version={0}', needs.plan.outputs.version) || '' }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sync/Dockerfile
          platforms: linux/amd64
          load: true
          tags: solstice-sync:test
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync

      - name: Smoke test
        run: |
          set -euo pipefail
          # Under pipefail, `cmd | grep -q` fails at random: grep exits on the
          # first match and cmd dies writing the rest (SIGPIPE, 141). Piped
          # checks read everything with `grep ... >/dev/null` instead.
          # The state and notes mount points must be owned by uid 1000.
          cid=$(docker create solstice-sync:test)
          docker export "$cid" | tar -tvf - | grep -E ' (state|notes)/?$' | tee /dev/stderr | grep -c '1000/1000' | grep '^2$' >/dev/null
          docker rm "$cid" >/dev/null

          # No sign-in configured: it refuses to start, and says why.
          if docker run --rm solstice-sync:test >noauth.log 2>&1; then echo 'started without sign-in' >&2; exit 1; fi
          grep 'SOLSTICE_OIDC_ISSUER' noauth.log >/dev/null

          # Dev sign-in, with state on a named volume.
          docker run -d --name dev -p 8080:8080 -e SOLSTICE_DEV_USER=smoke -v smoke_state:/state solstice-sync:test
          for i in $(seq 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -fsS localhost:8080/v1/info | grep '"protocol":1' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"name":"Notes"}' localhost:8080/v1/vaults)" = 201
          curl -fsS localhost:8080/v1/vaults | grep '"name":"Notes"' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/nope)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'authorization: Bearer sst_nope' localhost:8080/v1/vaults)" = 401

          # The web app: the shell with its policy (dev sign-in needs no session).
          curl -fsS -D headers.txt localhost:8080/ | grep '<div id="root">' >/dev/null
          grep -i "^content-security-policy: default-src 'self'; script-src 'self' 'sha256-" headers.txt >/dev/null
          curl -fsS localhost:8080/vault/Notes | grep '<div id="root">' >/dev/null

          docker logs dev 2>&1 | tee sync.log
          grep 'state database migrated' sync.log >/dev/null
          if grep -q $'\x1b' sync.log; then echo 'ANSI escapes in docker logs' >&2; exit 1; fi

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sync/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sync

  # A release is the image under its version plus a git tag, which is all the
  # sync server has (no GitHub Release: the app's updater reads the newest
  # one). The tag marks the commit that was built; then the version goes into
  # the repo. main is protected by a ruleset, so this pushes with the deploy key
  # (as release-bump.yml does); its push runs workflows, hence [skip ci].
  release:
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_BUMP_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="sync-v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists."
          else
            git tag -a "$tag" -m "Solstice Sync $VERSION" -m "$NOTES" "$SHA"
            git push origin "$tag"
          fi
      - name: Put the version in main
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/release/set-version.mjs --product sync "$VERSION"
          if git diff --quiet; then
            echo "main already says $VERSION."
            exit 0
          fi
          git commit -a -m "chore(release): sync $VERSION [skip ci]"
          # main may have moved while this ran.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Could not push the version bump to main."
          exit 1
