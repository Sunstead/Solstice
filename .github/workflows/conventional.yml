name: Conventional commits

# A squash-merged PR's title is its commit, and the commits on main since the
# last release pick the next version (scripts/release/, RELEASING.md).

on:
  push:
    branches: [main]
    paths: [scripts/release/**]
  pull_request:
    # `edited` so fixing a title re-runs the check.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventional-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/check-title.mjs "$TITLE"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release script tests
        run: node --test 'scripts/release/*.test.mjs'
