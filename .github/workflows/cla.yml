name: CLA

# Asks pull request authors to sign CLA.md once; signatures are kept in
# .github/cla-signatures.json on the cla-signatures branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event.comment.body == 'recheck'
        || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only if main is protected: a token that may push the
          # signatures branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/Sunstead/Solstice/blob/main/CLA.md
          branch: cla-signatures
          allowlist: InventorPWB,bot*,dependabot*
